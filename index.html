<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>LUDQueen 👑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ==================== 1. TITLE ==================== -->
  <section id="screen-title" class="screen is-active">
    <div class="title-wrap">
      <div class="title-crown">👑</div>
      <h1 class="game-title"><span class="tt-a">LUD</span><span class="tt-b">Queen</span></h1>
      <p class="title-sub">Knight · Elf · Witch · Dragon</p>
      <p id="tap-to-play" class="tap-to-play">tap to play</p>
    </div>
  </section>

  <!-- ==================== 2. MAIN MENU ==================== -->
  <section id="screen-menu" class="screen">
    <div class="sheet">
      <h2 class="sheet-title">Pilih Mode</h2>

      <button class="mode-btn" data-mode="classic">
        <span class="mode-icon">🎲</span>
        <span class="mode-text"><strong>Ludo Classic</strong><small>Aturan ludo standar · 2–4 pemain</small></span>
      </button>

      <button class="mode-btn mode-chaos" data-mode="chaos">
        <span class="mode-icon">🌀</span>
        <span class="mode-text"><strong>Ludo Chaos</strong><small>Dadu spesial · peluang bisa diatur sendiri</small></span>
      </button>
    </div>
  </section>

  <!-- ==================== 3. PENGATURAN DADU CHAOS ==================== -->
  <section id="screen-chaos" class="screen">
    <div class="sheet">
      <h2 class="sheet-title">Peluang Dadu Chaos</h2>
      <p class="sheet-sub">Atur sendiri peluang tiap sisi dadu spesial.</p>

      <div class="prob-list" id="prob-list"></div>

      <div class="prob-summary">
        <span>Normal 1–6: <b id="prob-normal">75%</b></span>
        <span>Total spesial: <b id="prob-special">25%</b></span>
      </div>
      <p class="prob-warn" id="prob-warn" hidden>Total spesial tidak boleh lebih dari 100%.</p>

      <div class="prob-legend" id="prob-legend"></div>

      <div class="sheet-actions">
        <button class="btn-ghost" id="chaos-back">Kembali</button>
        <button class="btn-primary" id="chaos-next">Lanjutkan</button>
      </div>
    </div>
  </section>

  <!-- ==================== 4. SETUP PEMAIN ==================== -->
  <section id="screen-setup" class="screen">
    <div class="sheet">
      <h2 class="sheet-title">Susun Pasukan</h2>
      <p class="sheet-sub" id="setup-mode-label">Ludo Classic</p>

      <div class="slot-list" id="slot-list"></div>

      <div class="sheet-actions">
        <button class="btn-ghost" id="setup-back">Kembali</button>
        <button class="btn-primary" id="setup-start">Mulai</button>
      </div>
    </div>
  </section>

  <!-- ==================== 5. GAME ==================== -->
  <section id="screen-game" class="screen screen-game">

    <header class="game-head">
      <h1 id="game-title">LUDO CHAOS (CUSTOM)</h1>
      <button class="hamburger" id="btn-menu" aria-label="Menu">☰</button>
    </header>

    <div class="arena">
      <div class="pcard-row">
        <div class="pcard" data-color="red"></div>
        <div class="pcard" data-color="green"></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board">
          <div class="board-grid" id="board-grid"></div>

          <div class="yard" data-color="red"><i></i></div>
          <div class="yard" data-color="green"><i></i></div>
          <div class="yard" data-color="blue"><i></i></div>
          <div class="yard" data-color="yellow"><i></i></div>

          <div class="center-zone"><span class="center-star">★</span></div>

          <div class="piece-layer" id="piece-layer"></div>
          <div class="fx-layer" id="fx-layer"></div>
        </div>
      </div>

      <div class="pcard-row">
        <div class="pcard" data-color="blue"></div>
        <div class="pcard" data-color="yellow"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <!-- menu dalam permainan -->
    <div class="drawer" id="game-menu" hidden>
      <div class="drawer-card">
        <button class="drawer-item" id="mi-sound">🔊 Suara: Aktif</button>
        <button class="drawer-item" id="mi-restart">🔄 Ulang Permainan</button>
        <button class="drawer-item" id="mi-home">🏠 Menu Utama</button>
        <button class="drawer-item drawer-close" id="mi-close">Tutup</button>
      </div>
    </div>

    <!-- kemenangan -->
    <div class="modal" id="modal-win" hidden>
      <div class="modal-card">
        <div class="win-figure" id="win-figure"></div>
        <h2 id="win-title">Knight Menang!</h2>
        <div class="sheet-actions">
          <button class="btn-ghost" id="btn-to-menu">Menu Utama</button>
          <button class="btn-primary" id="btn-rematch">Main Lagi</button>
        </div>
      </div>
    </div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
